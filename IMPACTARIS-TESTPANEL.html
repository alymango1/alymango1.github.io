<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impactaris Test Panel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #000; color: #fff; font-family: Arial, sans-serif; padding: 24px; }
  h1 { font-size: 16px; margin-bottom: 8px; }
  p.sub { font-size: 12px; line-height: 1.5; color: #bbb; margin-bottom: 24px; max-width: 650px; }
  h2 { font-size: 12px; color: #bbb; margin: 20px 0 8px; text-transform: uppercase; letter-spacing: .05em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 6px; }
  a { display: block; padding: 9px 10px; font-size: 12px; text-decoration: none; text-align: center; border: 1px solid; border-radius: 2px; color: #eee; }
  a:hover { background: #222; }
  a:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .emp { border-color: #fbff00; }
  .con { border-color: #ff0000; }
  .cli { border-color: #5271ff; }
  .par { border-color: #15ff00; }
  .frm { border-color: #ff00e6; }
  a.locked { border-style: dashed; }
</style>
</head>
<body>
<h1>Impactaris Test Panel</h1>
<p class="sub">Open links while signed in as Andrew or Jri. These options preview dashboard states; real data and actions still follow your account permissions.</p>
<div id="root"></div>
<script>
const BASE = 'https://www.impactaris.com';
const DASHBOARDS = [
  {
    "path": "/dashboard/employee",
    "label": "Employee",
    "cls": "emp",
    "hasBadges": true
  },
  {
    "path": "/dashboard/contractor",
    "label": "Contractor",
    "cls": "con",
    "hasBadges": true
  },
  {
    "path": "/dashboard/client",
    "label": "Client",
    "cls": "cli",
    "hasBadges": false
  },
  {
    "path": "/dashboard/partner",
    "label": "Partner",
    "cls": "par",
    "hasBadges": true
  }
];
const BADGES = [
  [
    "accountExecutive",
    "Account Executive"
  ],
  [
    "accountManager",
    "Account Manager"
  ],
  [
    "socialMedia",
    "Social Media Manager"
  ],
  [
    "graphicDesigner",
    "Graphic Designer"
  ],
  [
    "videoEditor",
    "Video Editor"
  ],
  [
    "photoEditor",
    "Photo Editor"
  ],
  [
    "webDeveloper",
    "Web Developer"
  ],
  [
    "seoSpecialist",
    "SEO Specialist"
  ],
  [
    "copywriter",
    "Copywriter"
  ],
  [
    "administration",
    "Administration"
  ],
  [
    "salesResearcher",
    "Sales Researcher"
  ],
  [
    "3dModeler",
    "3D Modeler"
  ],
  [
    "contentCreator",
    "Content Creator"
  ],
  [
    "emailSpecialist",
    "Email Specialist"
  ],
  [
    "customerService",
    "Customer Service"
  ],
  [
    "sem",
    "SEM"
  ],
  [
    "paidAdsSpecialist",
    "Paid Ads Specialist"
  ],
  [
    "textMarketer",
    "Text Marketer"
  ]
];
// Existing form destinations are preserved. Their availability has not been verified.
const FORMS = [
  "/partner-weekly-report-form",
  "/suggestion-form",
  "/incident-report-form",
  "/payout-request-form",
  "/support-request-form",
  "/bug-report-form",
  "/shift-completion-form",
  "/general-work-request-form",
  "/submit-invoice-form"
];

function formLabel(path) {
  return path.replace(/^\//, '').replace(/-form$/, '').split('-')
    .map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
}

function buildUrl(path, dashboard, trained, badge) {
  const url = new URL(path, BASE);
  url.searchParams.set('dashboard', dashboard);
  url.searchParams.set('trained', trained);
  if (badge) url.searchParams.set('badge', badge);
  return url.href;
}

function makeLink(href, text, cls, locked) {
  const a = document.createElement('a');
  a.href = href;
  a.textContent = text;
  a.className = cls + (locked ? ' locked' : '');
  a.target = '_blank';
  a.rel = 'noopener noreferrer';
  return a;
}

const root = document.getElementById('root');
DASHBOARDS.forEach(d => {
  const h2 = document.createElement('h2');
  h2.textContent = d.label;
  root.appendChild(h2);
  const grid = document.createElement('div');
  grid.className = 'grid';
  grid.appendChild(makeLink(buildUrl(d.path, d.label, 'false', ''), 'Locked', d.cls, true));
  grid.appendChild(makeLink(buildUrl(d.path, d.label, 'true', ''), 'Unlocked', d.cls, false));
  if (d.hasBadges) {
    BADGES.forEach(([value, label]) => {
      grid.appendChild(makeLink(buildUrl(d.path, d.label, 'true', value), label, d.cls, false));
    });
  }
  root.appendChild(grid);
});

const formsH2 = document.createElement('h2');
formsH2.textContent = 'Forms';
root.appendChild(formsH2);
const formNote = document.createElement('p');
formNote.className = 'sub';
formNote.textContent = 'These open the actual forms. Test preview options do not apply to them.';
root.appendChild(formNote);
const formsGrid = document.createElement('div');
formsGrid.className = 'grid';
FORMS.forEach(path => {
  formsGrid.appendChild(makeLink(new URL(path, BASE).href, formLabel(path), 'frm', false));
});
root.appendChild(formsGrid);
</script>
</body>
</html>
